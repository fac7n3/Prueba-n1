<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ordu · Llama 3.2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg0: #070a0f;
      --bg1: #0c111a;
      --sidebar-w: 280px;
      --surface: rgba(18, 24, 36, 0.72);
      --surface-solid: #121824;
      --surface-elevated: rgba(22, 30, 45, 0.95);
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.12);
      --text: #f1f4f9;
      --text-secondary: #94a3b8;
      --accent: #6366f1;
      --accent-soft: rgba(99, 102, 241, 0.18);
      --accent-hover: #4f46e5;
      --user-bg: rgba(99, 102, 241, 0.12);
      --assistant-bg: rgba(255, 255, 255, 0.04);
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-lg: 0 24px 80px rgba(0, 0, 0, 0.45);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.3, 0.64, 1);
      --font: "Inter", system-ui, -apple-system, sans-serif;
      --dur-fast: 0.18s;
      --dur-med: 0.4s;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg0);
      background-image:
        radial-gradient(ellipse 120% 80% at 50% -20%, rgba(99, 102, 241, 0.22), transparent),
        radial-gradient(ellipse 80% 50% at 100% 50%, rgba(56, 189, 248, 0.06), transparent),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg0) 100%);
      -webkit-font-smoothing: antialiased;
    }

    @keyframes appIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .shell {
      height: 100%;
      display: flex;
      max-width: 1200px;
      margin: 0 auto;
      padding: clamp(0.5rem, 2vw, 1.25rem);
      gap: 0.75rem;
      animation: appIn 0.55s var(--ease-out) both;
    }

    @media (prefers-reduced-motion: reduce) {
      .shell {
        animation: none;
      }
      .row-msg-enter,
      .empty-state,
      .conv-item,
      .sidebar,
      .backdrop,
      .brand-mark,
      .send,
      .composer-focus {
        animation: none !important;
        transition: none !important;
      }
    }

    /* ——— Sidebar ——— */
    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 40;
      opacity: 0;
      transition: opacity var(--dur-med) var(--ease-out);
      pointer-events: none;
    }

    .backdrop.visible {
      opacity: 1;
      pointer-events: auto;
    }

    @media (max-width: 840px) {
      .backdrop {
        display: block;
      }
    }

    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 1rem;
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      min-height: 0;
      transition: transform var(--dur-med) var(--ease-out), box-shadow var(--dur-fast);
    }

    @media (max-width: 840px) {
      .sidebar {
        position: fixed;
        top: clamp(0.5rem, 2vw, 1.25rem);
        bottom: clamp(0.5rem, 2vw, 1.25rem);
        left: clamp(0.5rem, 2vw, 1.25rem);
        z-index: 50;
        max-width: min(var(--sidebar-w), 88vw);
        transform: translateX(calc(-100% - 24px));
      }

      .sidebar.open {
        transform: translateX(0);
      }
    }

    .sidebar-head {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .sidebar-head h2 {
      margin: 0;
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
    }

    .btn-new {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.65rem 0.875rem;
      border: 1px dashed rgba(99, 102, 241, 0.45);
      border-radius: var(--radius-md);
      background: rgba(99, 102, 241, 0.08);
      color: #c7d2fe;
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      transition:
        background var(--dur-fast),
        border-color var(--dur-fast),
        transform 0.12s var(--ease-spring);
    }

    .btn-new:hover:not(:disabled) {
      background: rgba(99, 102, 241, 0.16);
      border-color: rgba(129, 140, 248, 0.65);
    }

    .btn-new:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-new:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-new svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    #conv-list {
      flex: 1;
      overflow-y: auto;
      margin: 0 -0.25rem;
      padding: 0 0.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-height: 0;
    }

    .conv-item {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      width: 100%;
      text-align: left;
      padding: 0.65rem 0.6rem;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
      position: relative;
      transition:
        background var(--dur-fast),
        border-color var(--dur-fast),
        transform 0.12s ease;
      animation: convFade 0.4s var(--ease-out) both;
    }

    @keyframes convFade {
      from {
        opacity: 0;
        transform: translateX(-8px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .conv-item:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border);
    }

    .conv-item.active {
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.35);
    }

    .conv-item:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .conv-body {
      flex: 1;
      min-width: 0;
    }

    .conv-title {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conv-meta {
      font-size: 0.6875rem;
      color: var(--text-secondary);
      margin-top: 0.2rem;
    }

    .conv-del {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: none;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      opacity: 0;
      transition:
        opacity var(--dur-fast),
        background var(--dur-fast),
        color var(--dur-fast);
    }

    .conv-item:hover .conv-del,
    .conv-item:focus-within .conv-del {
      opacity: 1;
    }

    .conv-del:hover {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
    }

    .conv-del svg {
      width: 16px;
      height: 16px;
    }

    .sidebar-foot {
      font-size: 0.6875rem;
      color: var(--text-secondary);
      line-height: 1.4;
      padding-top: 0.25rem;
      border-top: 1px solid var(--border);
    }

    /* ——— Main column ——— */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 0;
    }

    .topbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }

    .btn-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      cursor: pointer;
      flex-shrink: 0;
      transition:
        background var(--dur-fast),
        border-color var(--dur-fast),
        transform 0.1s ease;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-strong);
    }

    .btn-icon:active {
      transform: scale(0.95);
    }

    @media (min-width: 841px) {
      .btn-icon.menu-toggle {
        display: none;
      }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent) 0%, #818cf8 100%);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      animation: brandGlow 4s ease-in-out infinite;
    }

    @keyframes brandGlow {
      0%,
      100% {
        box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      }
      50% {
        box-shadow: 0 4px 22px rgba(129, 140, 248, 0.5);
      }
    }

    .brand-mark svg {
      width: 20px;
      height: 20px;
      color: white;
    }

    .brand-text h1 {
      margin: 0;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: min(42vw, 240px);
    }

    @media (min-width: 480px) {
      .brand-text h1 {
        max-width: 320px;
      }
    }

    .brand-text p {
      margin: 0.1rem 0 0;
      font-size: 0.6875rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .badge {
      display: none;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.55rem;
      font-size: 0.625rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 999px;
      flex-shrink: 0;
    }

    @media (min-width: 520px) {
      .badge {
        display: inline-flex;
      }
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
    }

    .badge.streaming .badge-dot {
      background: #f59e0b;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.55);
      animation: pulseDot 1s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%,
      100% {
        opacity: 0.5;
      }
      50% {
        opacity: 1;
      }
    }

    .thread-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      transition: box-shadow var(--dur-med);
    }

    .thread-wrap:focus-within {
      box-shadow:
        var(--shadow-lg),
        0 0 0 1px rgba(99, 102, 241, 0.25);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1rem;
      scroll-behavior: smooth;
    }

    @media (min-width: 640px) {
      #chat {
        padding: 1.5rem 1.25rem;
      }
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: min(52vh, 420px);
      padding: 2rem 1.25rem;
      animation: emptyIn 0.65s var(--ease-out) both;
    }

    @keyframes emptyIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .empty-orb {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(99, 102, 241, 0.35), rgba(56, 189, 248, 0.12));
      border: 1px solid rgba(255, 255, 255, 0.12);
      margin-bottom: 1.25rem;
      position: relative;
      animation: orbFloat 5s ease-in-out infinite;
    }

    .empty-orb::after {
      content: "";
      position: absolute;
      inset: 18%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.25), transparent 60%);
    }

    @keyframes orbFloat {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    .empty-state h3 {
      margin: 0 0 0.5rem;
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .empty-state p {
      margin: 0;
      max-width: 320px;
      font-size: 0.875rem;
      line-height: 1.55;
      color: var(--text-secondary);
    }

    .row {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      max-width: 100%;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    .row.user {
      flex-direction: row-reverse;
    }

    .row-msg-enter {
      animation: rowEnter 0.48s var(--ease-out) both;
    }

    @keyframes rowEnter {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 0.625rem;
      font-weight: 700;
      margin-top: 0.125rem;
    }

    .row.assistant .avatar {
      background: var(--accent-soft);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.25);
    }

    .row.user .avatar {
      background: rgba(148, 163, 184, 0.15);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .bubble-wrap {
      min-width: 0;
      flex: 1;
      max-width: min(100%, 640px);
    }

    .row.user .bubble-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .meta {
      font-size: 0.625rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      margin-bottom: 0.35rem;
    }

    .row.user .meta {
      text-align: right;
    }

    .msg {
      padding: 0.875rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.9375rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      transition: box-shadow 0.2s ease;
    }

    .row.assistant .msg {
      background: var(--assistant-bg);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
    }

    .row.user .msg {
      background: var(--user-bg);
      border: 1px solid rgba(99, 102, 241, 0.22);
    }

    .msg.streaming {
      color: var(--text);
    }

    .msg.streaming::after {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-left: 3px;
      margin-bottom: 2px;
      border-radius: 50%;
      background: var(--accent);
      vertical-align: middle;
      animation: pulse 0.9s ease-in-out infinite;
    }

    .msg.error {
      background: rgba(127, 29, 29, 0.2);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: #fecaca;
      font-size: 0.875rem;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.35;
        transform: scale(0.85);
      }
      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .dock {
      flex-shrink: 0;
      padding: 1rem 0 clamp(1rem, 3vw, 1.5rem);
    }

    .composer {
      display: flex;
      gap: 0.625rem;
      align-items: flex-end;
      padding: 0.5rem;
      background: var(--surface-solid);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.25);
      transition: border-color var(--dur-fast), box-shadow var(--dur-fast);
    }

    .composer:focus-within {
      border-color: rgba(99, 102, 241, 0.45);
      box-shadow:
        0 -8px 40px rgba(0, 0, 0, 0.25),
        0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 180px;
      resize: none;
      padding: 0.75rem 0.875rem;
      border: none;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.9375rem;
      line-height: 1.45;
    }

    textarea::placeholder {
      color: var(--text-secondary);
      opacity: 0.8;
    }

    textarea:focus {
      outline: none;
    }

    .send {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      padding: 0;
      border: none;
      border-radius: var(--radius-md);
      background: var(--accent);
      color: white;
      cursor: pointer;
      flex-shrink: 0;
      transition:
        background var(--dur-fast),
        transform 0.12s var(--ease-spring),
        box-shadow var(--dur-fast);
    }

    .send:hover:not(:disabled) {
      background: var(--accent-hover);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
    }

    .send:active:not(:disabled) {
      transform: scale(0.94);
    }

    .send:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .send svg {
      width: 20px;
      height: 20px;
      transition: transform 0.25s var(--ease-spring);
    }

    .send:hover:not(:disabled) svg {
      transform: translate(2px, -2px) rotate(-8deg);
    }

    .hint {
      margin: 0.5rem 0.75rem 0;
      font-size: 0.6875rem;
      color: var(--text-secondary);
    }

    .toast {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      padding: 0.65rem 1rem;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text);
      background: var(--surface-elevated);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      transition:
        opacity 0.3s ease,
        transform 0.35s var(--ease-out);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Historial de conversaciones">
      <div class="sidebar-head">
        <h2>Historial</h2>
        <button type="button" class="btn-new" id="btn-new" title="Nueva conversación">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14" />
          </svg>
          Nueva conversación
        </button>
      </div>
      <div id="conv-list"></div>
      <p class="sidebar-foot">
        Los chats se guardan en este navegador (local). No se envían a ningún servidor salvo al modelo al chatear.
      </p>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="top-left">
          <button type="button" class="btn-icon menu-toggle" id="menu-toggle" aria-label="Abrir historial">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 6h16M4 12h16M4 18h7" />
            </svg>
          </button>
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3c4.97 0 9 3.58 9 8s-4.03 8-9 8c-1.5 0-2.92-.33-4.2-.93L3 21l1.5-4.8C3.55 14.25 3 12.67 3 11c0-4.42 4.03-8 9-8z" />
              </svg>
            </div>
            <div class="brand-text">
              <h1 id="active-title">Asistente Ordu</h1>
              <p>Llama 3.2 · respuestas en streaming</p>
            </div>
          </div>
        </div>
        <span class="badge" id="status-badge">
          <span class="badge-dot" aria-hidden="true"></span>
          <span id="status-text">Listo</span>
        </span>
      </header>

      <div class="thread-wrap" id="thread-wrap">
        <main id="chat" aria-live="polite" aria-relevant="additions"></main>

        <footer class="dock">
          <form class="composer" id="form">
            <label for="input" class="visually-hidden">Mensaje</label>
            <textarea
              id="input"
              rows="1"
              placeholder="Escribí un mensaje…"
              autocomplete="off"
            ></textarea>
            <button type="submit" class="send" id="send" aria-label="Enviar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 2L11 13" />
                <path d="M22 2l-7 20-4-9-9-4 20-7z" />
              </svg>
            </button>
          </form>
          <p class="hint">Enter enviar · Shift+Enter nueva línea · Historial a la izquierda</p>
        </footer>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const API_URL = "http://187.127.253.96:11434/api/generate";
    const MODEL = "llama3.2:3b";
    const STORAGE_KEY = "ordu-chats-v1";
    const MAX_CONVERSATIONS = 36;
    const DEFAULT_TITLE = "Nueva conversación";

    const chatEl = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const btnNew = document.getElementById("btn-new");
    const convListEl = document.getElementById("conv-list");
    const sidebar = document.getElementById("sidebar");
    const backdrop = document.getElementById("backdrop");
    const menuToggle = document.getElementById("menu-toggle");
    const activeTitleEl = document.getElementById("active-title");
    const statusBadge = document.getElementById("status-badge");
    const statusTextEl = document.getElementById("status-text");
    const toastEl = document.getElementById("toast");

    /** @typedef {{ role: 'user' | 'assistant', text: string }} ChatMessage */
    /** @typedef {{ id: string, title: string, createdAt: number, updatedAt: number, messages: ChatMessage[] }} Conversation */

    /** @type {{ conversations: Conversation[], activeId: string }} */
    let store = loadStore();
    let isStreaming = false;
    let persistTimer = 0;

    function makeId() {
      if (typeof crypto !== "undefined" && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    }

    function loadStore() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return freshStore();
        const data = JSON.parse(raw);
        if (!data || !Array.isArray(data.conversations) || !data.activeId) {
          return freshStore();
        }
        for (const c of data.conversations) {
          if (!c.id || !Array.isArray(c.messages)) return freshStore();
        }
        const active = data.conversations.some((c) => c.id === data.activeId);
        if (!active && data.conversations.length) {
          data.activeId = data.conversations[0].id;
        }
        return data;
      } catch {
        return freshStore();
      }
    }

    function freshStore() {
      const id = makeId();
      return {
        conversations: [
          {
            id,
            title: DEFAULT_TITLE,
            createdAt: Date.now(),
            updatedAt: Date.now(),
            messages: [],
          },
        ],
        activeId: id,
      };
    }

    function persist() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
      } catch {
        showToast("No se pudo guardar (almacenamiento lleno o privado).");
      }
    }

    function schedulePersist() {
      window.clearTimeout(persistTimer);
      persistTimer = window.setTimeout(persist, 280);
    }

    function activeConv() {
      return store.conversations.find((c) => c.id === store.activeId);
    }

    function messages() {
      const c = activeConv();
      return c ? c.messages : [];
    }

    function trimConversations() {
      if (store.conversations.length <= MAX_CONVERSATIONS) return;
      const sorted = [...store.conversations].sort((a, b) => b.updatedAt - a.updatedAt);
      const keep = new Set(sorted.slice(0, MAX_CONVERSATIONS).map((c) => c.id));
      store.conversations = store.conversations.filter((c) => keep.has(c.id));
      if (!keep.has(store.activeId) && store.conversations.length) {
        store.activeId = store.conversations[0].id;
      }
    }

    function touchActive() {
      const c = activeConv();
      if (c) c.updatedAt = Date.now();
    }

    function titleFromFirstUser(conv) {
      const first = conv.messages.find((m) => m.role === "user");
      if (!first) return DEFAULT_TITLE;
      const t = first.text.replace(/\s+/g, " ").trim().slice(0, 52);
      return t || DEFAULT_TITLE;
    }

    function maybeAutoTitle(conv) {
      if (conv.title === DEFAULT_TITLE && conv.messages.some((m) => m.role === "user")) {
        conv.title = titleFromFirstUser(conv);
      }
    }

    function scrollToBottom() {
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    let toastHide = 0;
    function showToast(text) {
      toastEl.textContent = text;
      toastEl.classList.add("show");
      window.clearTimeout(toastHide);
      toastHide = window.setTimeout(() => toastEl.classList.remove("show"), 2600);
    }

    function setStreamingUI(on) {
      isStreaming = on;
      sendBtn.disabled = on;
      input.disabled = on;
      btnNew.disabled = on;
      statusBadge.classList.toggle("streaming", on);
      statusTextEl.textContent = on ? "Generando" : "Listo";
    }

    function closeMobileSidebar() {
      sidebar.classList.remove("open");
      backdrop.classList.remove("visible");
    }

    function openMobileSidebar() {
      sidebar.classList.add("open");
      backdrop.classList.add("visible");
    }

    menuToggle.addEventListener("click", () => {
      if (sidebar.classList.contains("open")) closeMobileSidebar();
      else openMobileSidebar();
    });

    backdrop.addEventListener("click", closeMobileSidebar);

    /**
     * @param {'user' | 'assistant'} role
     * @param {string} text
     * @param {{ streaming?: boolean, error?: boolean, animate?: boolean, staggerSec?: number }} opts
     */
    function appendRow(role, text, opts = {}) {
      const row = document.createElement("div");
      row.className = "row " + role;
      if (opts.animate !== false) row.classList.add("row-msg-enter");
      if (typeof opts.staggerSec === "number" && opts.staggerSec > 0) {
        row.style.animationDelay = opts.staggerSec + "s";
      }

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.setAttribute("aria-hidden", "true");
      avatar.textContent = role === "user" ? "Tú" : "IA";

      const wrap = document.createElement("div");
      wrap.className = "bubble-wrap";

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = role === "user" ? "Vos" : "Llama 3.2";

      const msg = document.createElement("div");
      msg.className = "msg";
      if (opts.streaming) msg.classList.add("streaming");
      if (opts.error) msg.classList.add("error");
      msg.textContent = text;

      wrap.appendChild(meta);
      wrap.appendChild(msg);
      row.appendChild(avatar);
      row.appendChild(wrap);
      chatEl.appendChild(row);
      scrollToBottom();
      return { row, msg };
    }

    function renderEmptyState() {
      const wrap = document.createElement("div");
      wrap.className = "empty-state";
      wrap.innerHTML =
        '<div class="empty-orb" aria-hidden="true"></div>' +
        "<h3>Empezá una conversación</h3>" +
        "<p>Escribí abajo: el historial queda guardado en este equipo. Podés abrir chats viejos desde el panel izquierdo.</p>";
      chatEl.appendChild(wrap);
    }

    function renderChatFromStore() {
      chatEl.innerHTML = "";
      const conv = activeConv();
      if (!conv) return;

      activeTitleEl.textContent = conv.title;

      const msgs = conv.messages;
      if (msgs.length === 0) {
        renderEmptyState();
        return;
      }

      msgs.forEach((m, i) => {
        appendRow(m.role, m.text, {
          animate: true,
          staggerSec: Math.min(i * 0.045, 0.42),
        });
      });
      scrollToBottom();
    }

    function renderSidebar() {
      convListEl.innerHTML = "";
      const sorted = [...store.conversations].sort((a, b) => b.updatedAt - a.updatedAt);
      sorted.forEach((conv, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "conv-item" + (conv.id === store.activeId ? " active" : "");
        btn.style.animationDelay = Math.min(idx * 0.035, 0.35) + "s";

        const body = document.createElement("div");
        body.className = "conv-body";
        const title = document.createElement("span");
        title.className = "conv-title";
        title.textContent = conv.title;
        const meta = document.createElement("div");
        meta.className = "conv-meta";
        meta.textContent = formatRelative(conv.updatedAt);
        body.appendChild(title);
        body.appendChild(meta);

        const del = document.createElement("button");
        del.type = "button";
        del.className = "conv-del";
        del.setAttribute("aria-label", "Eliminar conversación");
        del.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6M10 11v6M14 11v6"/></svg>';

        del.addEventListener("click", (e) => {
          e.stopPropagation();
          deleteConversation(conv.id);
        });

        btn.appendChild(body);
        btn.appendChild(del);

        btn.addEventListener("click", () => selectConversation(conv.id));
        convListEl.appendChild(btn);
      });
    }

    function formatRelative(ts) {
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 60) return "Ahora";
      const m = Math.floor(s / 60);
      if (m < 60) return `Hace ${m} min`;
      const h = Math.floor(m / 60);
      if (h < 24) return `Hace ${h} h`;
      const d = Math.floor(h / 24);
      if (d < 7) return `Hace ${d} d`;
      return new Date(ts).toLocaleDateString("es", { day: "numeric", month: "short" });
    }

    function selectConversation(id) {
      if (id === store.activeId) {
        closeMobileSidebar();
        return;
      }
      if (isStreaming) {
        showToast("Esperá a que termine la respuesta.");
        return;
      }
      store.activeId = id;
      persist();
      renderSidebar();
      renderChatFromStore();
      closeMobileSidebar();
      input.focus();
    }

    function newConversation() {
      if (isStreaming) {
        showToast("Esperá a que termine la respuesta.");
        return;
      }
      const id = makeId();
      store.conversations.unshift({
        id,
        title: DEFAULT_TITLE,
        createdAt: Date.now(),
        updatedAt: Date.now(),
        messages: [],
      });
      store.activeId = id;
      trimConversations();
      persist();
      renderSidebar();
      renderChatFromStore();
      closeMobileSidebar();
      input.focus();
    }

    function deleteConversation(id) {
      if (isStreaming) {
        showToast("Esperá a que termine la respuesta.");
        return;
      }
      const conv = store.conversations.find((c) => c.id === id);
      if (!conv) return;
      const ok = confirm("¿Eliminar esta conversación del historial?");
      if (!ok) return;

      store.conversations = store.conversations.filter((c) => c.id !== id);
      if (!store.conversations.length) {
        store = freshStore();
      } else if (store.activeId === id) {
        store.activeId = store.conversations[0].id;
      }
      persist();
      renderSidebar();
      renderChatFromStore();
    }

    btnNew.addEventListener("click", newConversation);

    function buildPrompt() {
      const parts = [];
      for (const m of messages()) {
        parts.push(
          m.role === "user" ? "Usuario: " + m.text : "Asistente: " + m.text
        );
      }
      parts.push("Asistente:");
      return parts.join("\n\n");
    }

    /**
     * @param {Response} res
     * @param {(piece: string) => void} onToken
     */
    async function consumeOllamaStream(res, onToken) {
      if (!res.body) throw new Error("Sin cuerpo en la respuesta");
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop() ?? "";

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed) continue;
          let obj;
          try {
            obj = JSON.parse(trimmed);
          } catch {
            continue;
          }
          if (obj.error) throw new Error(obj.error);
          if (typeof obj.response === "string" && obj.response.length) {
            onToken(obj.response);
          }
        }
      }

      const tail = buffer.trim();
      if (tail) {
        try {
          const obj = JSON.parse(tail);
          if (obj.error) throw new Error(obj.error);
          if (typeof obj.response === "string" && obj.response.length) {
            onToken(obj.response);
          }
        } catch {
          /* ignore */
        }
      }
    }

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 180) + "px";
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      const conv = activeConv();
      if (!conv) return;

      input.value = "";
      input.style.height = "auto";

      const empty = chatEl.querySelector(".empty-state");
      if (empty) empty.remove();
      chatEl.querySelectorAll(".row .msg.error").forEach((el) => {
        el.closest(".row")?.remove();
      });

      conv.messages.push({ role: "user", text });
      touchActive();
      maybeAutoTitle(conv);
      activeTitleEl.textContent = conv.title;
      schedulePersist();
      renderSidebar();

      appendRow("user", text);

      const { msg: assistantMsg } = appendRow("assistant", "", { streaming: true });
      setStreamingUI(true);

      let full = "";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: MODEL,
            prompt: buildPrompt(),
            stream: true,
          }),
        });

        if (!res.ok) {
          const errText = await res.text();
          let errMsg = res.statusText;
          try {
            const j = JSON.parse(errText);
            if (j.error) errMsg = j.error;
          } catch {
            if (errText) errMsg = errText.slice(0, 200);
          }
          throw new Error(errMsg || "Error del servidor");
        }

        await consumeOllamaStream(res, (piece) => {
          full += piece;
          assistantMsg.textContent = full;
          assistantMsg.classList.add("streaming");
          scrollToBottom();
        });

        assistantMsg.classList.remove("streaming");
        conv.messages.push({ role: "assistant", text: full });
        touchActive();
        persist();
        renderSidebar();
      } catch (err) {
        assistantMsg.closest(".row")?.remove();
        conv.messages.pop();
        if (!conv.messages.some((m) => m.role === "user")) {
          conv.title = DEFAULT_TITLE;
        }
        activeTitleEl.textContent = conv.title;
        touchActive();
        persist();

        const msg =
          err instanceof TypeError && err.message === "Failed to fetch"
            ? "No se pudo conectar. Suele ser CORS: configurá OLLAMA_ORIGINS en el servidor o usá un proxy."
            : String(err.message || err);
        appendRow("assistant", msg, { error: true });
        renderSidebar();
      } finally {
        setStreamingUI(false);
        input.focus();
      }
    });

    renderSidebar();
    renderChatFromStore();
    input.focus();
  </script>
</body>
</html>
