<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"

  <body>
    <div class="margen">

        class="w-[224px] h-[28] object-cover image"
        src="https://drive.google.com/file/d/1ScThEx_BJaW-SJ8JAnX8xlshF0ksTyYW/view?authuser=0&usp=classroom_web"
        alt="logo"
      />
      <h1
        class="text-2xl font-extrabold text-[4.5rem] line-height-[1.5] mt-4 h1"
      >
        Rapidly build modern websites without ever leaving your HTML.
      </h1>
      <p class="text-lg text-gray-600 mt-4">
        A utility-first CSS framework packed with classes like flex, pt-4,
        text-center and rotate-90 that can be composed to build any design,
        directly in your markup.
      </p>
      <div class="flex">
        <button
          class="bg-blue-500 text-white px-4 py-2 rounded mt-4 mr-2 hover:bg-blue-600 transition-colors duration-300"
        >
          Get Started
        </button>
        <button
          class="flex bg-blue-500 text-white px-4 py-2 rounded mt-4 mr-2 hover:bg-blue-600 transition-colors duration-300 gap-[20px]"
        >
          <p>$ npm install tailwindcss</p>
          <svg
            width="24"
            height="24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
