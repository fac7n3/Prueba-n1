<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso al Banco</title>
    <style>
      
    </style>
</head>
<body>
    <h1>Ingreso al Banco</h1>
    
    <div class="form-group">
        <label for="edad">Edad:</label>
        <input type="number" id="edad" placeholder="Ingrese su edad">
    </div>

    <div class="form-group">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" placeholder="Ingrese su nombre">
    </div>

    <div class="form-group">
        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" placeholder="Ingrese su apellido">
    </div>

    <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Ingrese su email">
    </div>

    <div class="form-group">
        <label for="dni">DNI:</label>
        <input type="text" id="dni" placeholder="Ingrese su DNI (10 caracteres)">
    </div>

    <button onclick="hacerIngreso()">Ingresar</button>

    <div id="mensaje"></div>

    <script src="./main.js"></script>
</body>
</html>
